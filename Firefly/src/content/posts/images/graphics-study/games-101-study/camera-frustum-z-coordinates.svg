<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
  <title id="title">相机视锥体与近远裁剪平面的 Z 坐标</title>
  <desc id="desc">相机位于原点 O，朝负 Z 方向观察，视轴在图中朝四十五度右下方。正 Z 轴指向左上方。近平面的 Z 坐标为 n，远平面的 Z 坐标为 f，二者均为负值，且 f 小于 n 小于零。n 和 f 标在视轴对应的平面中心位置。</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5.5 L 0 11 Z" fill="#243247"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243247; font-size: 19px; }
      .minor { font-size: 16px; fill: #536278; }
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
      .symbol { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 25px; }
      .edge { fill: none; stroke: #71849c; stroke-width: 1.7px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="800" height="680" fill="#ffffff"/>

  <!-- The viewing axis is exactly 45 degrees toward the lower right. -->
  <!-- O=(190,160), near center=(280,250), far center=(510,480). -->
  <!-- Near-plane corners are far-plane corners scaled about O by n/f=9/32. -->
  <g id="frustum-volume">
    <polygon points="430,390 670,430 590,570 350,530" fill="#3d73ba" fill-opacity="0.08"/>
    <polygon points="257.5,224.6875 325,235.9375 670,430 430,390" fill="#3d73ba" fill-opacity="0.055"/>
    <polygon points="325,235.9375 302.5,275.3125 590,570 670,430" fill="#3d73ba" fill-opacity="0.04"/>
    <polygon points="302.5,275.3125 235,264.0625 350,530 590,570" fill="#3d73ba" fill-opacity="0.035"/>
    <polygon points="235,264.0625 257.5,224.6875 430,390 350,530" fill="#3d73ba" fill-opacity="0.04"/>
    <g class="edge">
      <path d="M 257.5 224.6875 L 430 390" stroke-dasharray="5 5"/>
      <path d="M 325 235.9375 L 670 430"/>
      <path d="M 302.5 275.3125 L 590 570"/>
      <path d="M 235 264.0625 L 350 530"/>
    </g>
    <g fill="none" stroke="#a0aaba" stroke-width="1.2" stroke-dasharray="4 5">
      <path d="M 190 160 L 257.5 224.6875"/>
      <path d="M 190 160 L 325 235.9375"/>
      <path d="M 190 160 L 302.5 275.3125"/>
      <path d="M 190 160 L 235 264.0625"/>
    </g>
  </g>

  <g id="clipping-planes" stroke-linejoin="round">
    <polygon id="far-plane" points="430,390 670,430 590,570 350,530" fill="none" stroke="#3d73ba" stroke-width="2.4"/>
    <polygon id="near-plane" points="257.5,224.6875 325,235.9375 302.5,275.3125 235,264.0625" fill="#d77a32" fill-opacity="0.15" stroke="#bd6727" stroke-width="2.4"/>
  </g>

  <g id="z-axis" fill="none" stroke="#243247">
    <path id="positive-z" d="M 190 160 L 80 50" stroke-width="2" marker-end="url(#axis-arrow)"/>
    <path id="negative-z" d="M 190 160 L 620 590" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#axis-arrow)"/>
    <path id="view-direction" d="M 215 185 L 248 218" stroke-width="2.1" marker-end="url(#axis-arrow)"/>
  </g>

  <!-- n and f are signed Z coordinates, indicated by ticks on the Z axis. -->
  <g id="z-coordinate-ticks" fill="none" stroke-width="2">
    <path id="near-z-tick" d="M 272 258 L 288 242" stroke="#bd6727"/>
    <path id="far-z-tick" d="M 502 488 L 518 472" stroke="#3d73ba"/>
  </g>
  <text class="symbol halo" x="260" y="287" text-anchor="middle">n</text>
  <text class="symbol halo" x="486" y="514" text-anchor="middle">f</text>

  <!-- Camera body lies behind O; the lens optical center is precisely O. -->
  <g id="camera" transform="translate(190 160) rotate(45)" stroke="#536278" stroke-width="1.7" stroke-linejoin="round">
    <path d="M -67 -23 L -25 -23 L -19 -16 L -19 16 L -25 23 L -67 23 Z" fill="#e8edf3"/>
    <path d="M -19 -12 L -6 -17 L 0 -17 L 0 17 L -6 17 L -19 12 Z" fill="#cbd6e4"/>
    <path d="M -59 -23 L -53 -31 L -35 -31 L -30 -23" fill="#e8edf3"/>
    <path d="M -67 0 L 0 0" stroke="#7a899d" stroke-width="1" stroke-dasharray="3 4"/>
  </g>

  <g id="axis-points">
    <circle id="origin" cx="190" cy="160" r="4.5" fill="#243247"/>
    <circle cx="280" cy="250" r="3.3" fill="#ffffff" stroke="#bd6727" stroke-width="1.7"/>
    <circle cx="510" cy="480" r="3.3" fill="#ffffff" stroke="#3d73ba" stroke-width="1.7"/>
  </g>

  <g id="labels">
    <text x="61" y="36" class="halo">+Z</text>
    <text x="630" y="606" class="halo">−Z</text>
    <path d="M 214 121 L 196 150" fill="none" stroke="#71849c" stroke-width="1.1"/>
    <text x="221" y="111">相机 / 原点 O</text>
    <text x="221" y="134" class="minor">(0, 0, 0)</text>
    <text x="266" y="186" class="minor halo">朝向 −Z</text>

    <path d="M 344 220 L 333 224 L 325 235.9375" fill="none" stroke="#bd6727" stroke-width="1.3"/>
    <text x="352" y="212">近平面</text>
    <text x="352" y="236" class="minor">z = n</text>

    <path d="M 693 478 L 656 488 L 630 500" fill="none" stroke="#3d73ba" stroke-width="1.3"/>
    <text x="700" y="468">远平面</text>
    <text x="700" y="492" class="minor">z = f</text>

    <text x="429" y="366" class="minor halo" transform="rotate(45 429 366)">视锥体</text>
    <text x="64" y="643" class="minor">n、f 为平面的 Z 坐标值，f &lt; n &lt; 0。</text>
  </g>
</svg>
